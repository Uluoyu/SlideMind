name: slidemind

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: slidemind
      POSTGRES_USER: slidemind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slidemind}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slidemind -d slidemind"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-slidemind}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-slidemind-local-development}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-slidemind}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-slidemind-local-development}
    entrypoint:
      - /bin/sh
      - -c
      - |
        attempts=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 30 ]; then exit 1; fi
          sleep 2
        done
        mc mb --ignore-existing local/ppt

volumes:
  postgres-data:
  minio-data:
