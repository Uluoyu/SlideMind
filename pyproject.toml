[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slidemind"
version = "0.1.0"
description = "Personal presentation agent workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1", "minio>=7.2,<8",
  "python-multipart>=0.0.20,<1", "httpx>=0.28,<1",
  "pymupdf>=1.25,<2", "python-docx>=1.1,<2", "python-pptx>=1.0,<2",
  "fastembed>=0.7,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api/src/slidemind_api", "apps/agent/src/slidemind_agent",
  "apps/rag/src/slidemind_rag", "apps/document-parser/src/slidemind_parser",
  "apps/vision-qa/src/slidemind_qa", "packages/schemas/src/slidemind_schemas",
  "packages/common/src/slidemind_common",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["slidemind_api", "slidemind_agent", "slidemind_common", "slidemind_schemas", "slidemind_rag", "slidemind_parser", "slidemind_qa"]
